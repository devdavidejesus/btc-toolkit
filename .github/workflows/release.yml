name: Release

# Pushing a tag vX.Y.Z builds the package and publishes it to PyPI through
# Trusted Publishing (OIDC — no API token stored anywhere). The publish step
# also generates PEP 740 attestations: signed provenance linking each file on
# PyPI to this repository and workflow run.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Tag must match the package version
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match version v$v"; exit 1; }
      - name: The tag must have release notes in CHANGELOG.md
        run: python .github/scripts/release_notes.py "$GITHUB_REF_NAME" > /dev/null
      - run: pip install --require-hashes -r .github/requirements/build.txt
      - run: python -m build
      - name: Smoke-test the built wheel
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          /tmp/wheel-env/bin/btc-toolkit --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/btc-toolkit/
    permissions:
      id-token: write  # OIDC token for Trusted Publishing — nothing else
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the GitHub Release
      id-token: write  # keyless Sigstore signing with this workflow's identity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - run: pip install --require-hashes -r .github/requirements/sign.txt
      - name: Sign the distributions with Sigstore
        run: python -m sigstore sign dist/*
      - name: Create the GitHub Release with the signed files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/release_notes.py "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$(python .github/scripts/release_notes.py "$GITHUB_REF_NAME" --title)" \
            --notes-file notes.md --verify-tag
