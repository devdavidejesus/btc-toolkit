name: OpenSSF Scorecard

# Independent supply-chain security assessment by the OpenSSF. Results are
# signed and published to https://scorecard.dev and shown as a README badge.

on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: "41 7 * * 3"  # Wednesdays, 07:41 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # upload results to the Security tab
      id-token: write         # sign the published results (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
