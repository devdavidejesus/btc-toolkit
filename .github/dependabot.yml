# btc-toolkit has no Python dependencies; this only keeps the pinned
# GitHub Actions (by commit SHA) up to date.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    # One pull request per run, so every bump is tested together and steps
    # from the same action (codeql-action/init, analyze, upload-sarif) move
    # in lockstep.
    groups:
      github-actions:
        patterns:
          - "*"
