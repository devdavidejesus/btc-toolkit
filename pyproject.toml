[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-toolkit"
version = "1.7.1"
description = "Bitcoin CLI toolkit — OP_RETURN decoder, balance checker, fee estimator & more. Zero deps, no Bitcoin Core required."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "Davi de Jesus", email = "devdavidejesus@users.noreply.github.com"},
]
keywords = ["bitcoin", "op_return", "balance", "mempool", "cli", "blockchain"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/devdavidejesus/btc-toolkit"
Repository = "https://github.com/devdavidejesus/btc-toolkit"
Issues = "https://github.com/devdavidejesus/btc-toolkit/issues"
Changelog = "https://github.com/devdavidejesus/btc-toolkit/blob/main/CHANGELOG.md"
Security = "https://github.com/devdavidejesus/btc-toolkit/blob/main/SECURITY.md"

[project.scripts]
btc-toolkit = "btc_toolkit.cli:run"

[tool.setuptools.packages.find]
include = ["btc_toolkit*"]

[tool.setuptools.package-data]
btc_toolkit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["btc_toolkit"]

[tool.coverage.run]
branch = true
source = ["btc_toolkit"]
omit = ["btc_toolkit/__main__.py"]  # 3-line entry point

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
